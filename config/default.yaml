ollama_host: "http://127.0.0.1:11434"
# Per-request read timeout for Ollama. Local inference on large models can take
# several minutes; 600 s gives ample room without hanging forever.
# The connect timeout is always 5 s regardless of this value.
ollama_timeout_seconds: 600
# Overall generation timeout for Ollama. This is a wall-clock deadline for the
# entire generation (not idle timeout). 1800 s (30 min) allows slow but valid
# generations while protecting against stalled/hanging models.
ollama_generation_timeout_seconds: 1800
preferred_model: "qwen3-coder:30b"
database_path: "data/po.db"
default_workspace: ""
log_level: "INFO"
agent_max_iterations: 50
agent_task_timeout_seconds: 3600
command_timeout_seconds: 120
command_output_limit_bytes: 50000
file_read_limit_bytes: 100000
search_max_results: 50
index_max_file_bytes: 1048576
permission_mode: "standard"
# Static site runtime verification (optional)
# When enabled, completion verification will start a local HTTP server
# and verify that the site and its local assets are servable.
verify_static_sites_runtime: false
# Time to wait for the local server to become ready before verification
verify_runtime_readiness_timeout_seconds: 10
# Port for the local verification server (0 = auto-assign)
verify_runtime_port: 0
ignore_directories:
  - ".git"
  - "node_modules"
  - ".venv"
  - "venv"
  - "__pycache__"
  - "dist"
  - "build"
  - "coverage"
  - ".tox"
  - ".mypy_cache"
  - ".pytest_cache"
  - ".next"
  - ".turbo"
  - "target"
  - ".idea"
  - ".vscode"
